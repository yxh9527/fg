elastic:
  hosts:
    - "http://172.21.211.219:9530"
  username: "elastic"
  password: "000000"
# 对外 HTTP 端口
server_port: 10032
# data-center gRPC（鉴权）；lottery gRPC（余额）；注单直连 ES
datacenter_grpc: "172.21.211.219:10081"
